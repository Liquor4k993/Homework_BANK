# ============================================
# ПЕРВАЯ БАЗА ДАННЫХ (H2 - READ ONLY) - @Primary
# ============================================
spring.datasource.h2.jdbc-url=jdbc:h2:file:./transaction;MODE=LEGACY;DB_CLOSE_ON_EXIT=FALSE;ACCESS_MODE_DATA=r
spring.datasource.h2.driver-class-name=org.h2.Driver
spring.datasource.h2.username=
spring.datasource.h2.password=

# ============================================
# ВТОРАЯ БАЗА ДАННЫХ (PostgreSQL - READ/WRITE)
# ============================================
spring.datasource.postgresql.jdbc-url=jdbc:postgresql://localhost:5432/recommendation_db
spring.datasource.postgresql.driver-class-name=org.postgresql.Driver
spring.datasource.postgresql.username=postgres
spring.datasource.postgresql.password=postgres

# ============================================
# НАСТРОЙКИ JPA (для PostgreSQL)
# ============================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# ============================================
# LIQUIBASE НАСТРОЙКИ
# ============================================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# ============================================
# SPRING CACHE
# ============================================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=30m

# ============================================
# НАСТРОЙКИ ЛОГИРОВАНИЯ
# ============================================
logging.level.com.bank.recommendation=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.liquibase=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ============================================
# НАСТРОЙКИ СЕРВЕРА
# ============================================
server.port=8080
spring.jackson.serialization.indent-output=true